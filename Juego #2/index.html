<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piedra, Papel o Tijera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="juego">
    <h3>Piedra, papel o tijera</h3>
    <p>Elige una opción para jugar contra la computadora.</p>
    
    <div class="opciones">
      <button class="btnOpcion" data-opcion="piedra">
        <img src="https://img.icons8.com/color/96/rock.png" alt="Piedra" width="40" height="40">
        Piedra
      </button>

      <button class="btnOpcion" data-opcion="papel">
        <img src="https://img.icons8.com/color/96/paper.png" alt="Papel" width="40" height="40">
        Papel
      </button>

      <button class="btnOpcion" data-opcion="tijera">
        <img src="https://img.icons8.com/color/96/scissors.png" alt="Tijera" width="40" height="40">
        Tijera
      </button>
    </div>

    <p id="resultadoJuego2"></p>
    <p id="marcadorJuego2">Ganadas: 0 | Perdidas: 0 | Empates: 0</p>
    <button id="btnReiniciarJuego2">Reiniciar marcador</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
