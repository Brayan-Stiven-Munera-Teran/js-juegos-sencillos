<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Memoria - Busca la Pareja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="juego-contenedor">
    <h2>Busca la pareja</h2>
    <p>Encuentra las parejas de símbolos iguales. Intentos: <span id="movimientosJuego3">0</span></p>

    <div id="tableroJuego3" class="tablero"></div>

    <div id="canecaBasura" class="caneca-basura">
      <svg viewBox="0 -8 24 32" width="46" height="52" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g class="caneca-tapa">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6V4a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v2"></path>
        </g>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
      <span>Basura</span>
    </div>

    <p id="mensajeJuego3"></p>

    <button id="btnReiniciarJuego3" class="btn-reiniciar">Reiniciar juego</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
