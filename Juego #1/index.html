<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el Número</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="juego">
    <h3>Adivina el número</h3>
    <p>Elegí un número entre 1 y 100. ¡Adivínalo!</p>
    <input type="number" id="intentoUsuario" min="1" max="100" placeholder="Tu número">
    <button id="btnAdivinar">Adivinar</button>
    <p id="mensajeJuego1"></p>
    <p id="intentosJuego1">Intentos: 0</p>
    <button id="btnReiniciarJuego1">Reiniciar juego</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
